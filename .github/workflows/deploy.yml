name: Deploy auf GitHub Pages

on:
  push:
    # Der Standard-Branch des Repos ist aktuell der Claude-Branch; später auf main umstellbar.
    branches: [main, claude/gracious-wright-j6q4sw]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # vite.config.ts nutzt base './' (relativ) – funktioniert unter /<repo>/ ohne Anpassung.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
